# Checks: ruff, the backend unit tests, and the frontend typecheck.
# Started by hand (Actions tab > checks > Run workflow), not on every
# push. The same steps run locally: see "Tests and eval" in the README.
# No deploy job: the backend is deployed by hand to Modal
# (`modal deploy backend/modal_app.py`) and the frontend by Vercel's own
# Git integration.
name: checks

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend (without the heavy model runtimes)
        # torch/transformers load lazily (TTS) and no test needs them.
        run: |
          grep -vE '^(torch|transformers|modal|sentencepiece)==' backend/requirements.txt > /tmp/req-ci.txt
          pip install -r /tmp/req-ci.txt -r backend/requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check backend

      - name: Tests
        env:
          # The server validates its config on import; no model is called.
          MUSE_SPARK_API_URL: https://example.invalid/v1
          MUSE_SPARK_API_KEY: ci-placeholder-not-a-key
        run: |
          python backend/test_risk.py
          python backend/test_audiofeat.py
          python backend/test_limits.py
          python backend/test_guard.py
          python backend/test_agent.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Typecheck (frontend)
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx tsc --noEmit -p .
