# Backend CI/CD.
#   Pull request: lint, typecheck, unit tests.
#   Push to main: the same checks, then build the container, push it to
#   Artifact Registry, deploy a new Cloud Run revision with no traffic,
#   smoke-test that revision (health + one tiny live Spark call), and
#   only then move traffic to it. A failed smoke test fails the workflow
#   and leaves the previous revision serving.
#
# GCP auth is Workload Identity Federation (no JSON keys anywhere). The
# one-time setup is infra/setup.sh; the repository variables it prints
# are set with `gh variable set` (see MY_TODO.md).
name: backend

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  # PR runs may cancel each other; deploys to main always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGION: asia-south1
  SERVICE: handyman-backend
  REPO: handyman

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend (without the heavy model runtimes)
        # torch/transformers load lazily (TTS) and no test needs them.
        run: |
          grep -vE '^(torch|transformers|modal|sentencepiece)==' backend/requirements.txt > /tmp/req-ci.txt
          pip install -r /tmp/req-ci.txt -r backend/requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check backend

      - name: Tests
        env:
          # The server validates its config on import; no model is called.
          MUSE_SPARK_API_URL: https://example.invalid/v1
          MUSE_SPARK_API_KEY: ci-placeholder-not-a-key
        run: |
          python backend/test_risk.py
          python backend/test_audiofeat.py
          python backend/test_limits.py
          python backend/test_guard.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Typecheck (frontend)
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx tsc --noEmit -p .

  deploy:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Workload Identity Federation
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check repository variables
        env:
          WIF: ${{ vars.GCP_WIF_PROVIDER }}
          DEPLOY_SA: ${{ vars.GCP_DEPLOY_SA }}
          RUN_SA: ${{ vars.GCP_RUN_SA }}
          GATEWAY: ${{ vars.MUSE_SPARK_API_URL }}
          ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
        run: |
          missing=""
          for v in PROJECT_ID WIF DEPLOY_SA RUN_SA GATEWAY ORIGINS; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository variables:$missing (see MY_TODO.md)"
            exit 1
          fi

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push the image
        id: image
        run: |
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$REPO/backend:${GITHUB_SHA::12}"
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build -f backend/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Deploy a new revision (no traffic yet)
        id: deploy
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          RUN_SA: ${{ vars.GCP_RUN_SA }}
          GATEWAY: ${{ vars.MUSE_SPARK_API_URL }}
          ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
        run: |
          TAG="sha-${GITHUB_SHA::7}"
          # Secrets come from Secret Manager at runtime; nothing secret is
          # passed on this command line or printed in the logs.
          ARGS=(
            --image "$IMAGE" --region "$REGION" --service-account "$RUN_SA"
            --cpu 2 --memory 4Gi --min-instances 1 --max-instances 3
            --concurrency 20 --timeout 300 --cpu-boost --allow-unauthenticated
            --set-env-vars "^@^HANDYMAN_ENV=production@SPARK_MODEL=prod@MUSE_SPARK_API_URL=$GATEWAY@ALLOWED_ORIGINS=$ORIGINS"
            --set-secrets "MUSE_SPARK_API_KEY=handyman-meta-api-key:latest,GOOGLE_PLACES_API_KEY=handyman-places-api-key:latest,PROXY_SECRET=handyman-proxy-secret:latest"
          )
          if gcloud run services describe "$SERVICE" --region "$REGION" >/dev/null 2>&1; then
            gcloud run deploy "$SERVICE" "${ARGS[@]}" --no-traffic --tag "$TAG"
            URL=$(gcloud run services describe "$SERVICE" --region "$REGION" \
              --format=json | jq -r --arg t "$TAG" '.status.traffic[] | select(.tag==$t) | .url')
            echo "first=false" >> "$GITHUB_OUTPUT"
          else
            # First deploy: a new service can't start with no traffic.
            gcloud run deploy "$SERVICE" "${ARGS[@]}"
            URL=$(gcloud run services describe "$SERVICE" --region "$REGION" --format='value(status.url)')
            echo "first=true" >> "$GITHUB_OUTPUT"
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Smoke test the new revision
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          SECRET=$(gcloud secrets versions access latest --secret=handyman-proxy-secret)
          echo "::add-mask::$SECRET"
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors "$URL/api/health" | tee /tmp/health.json
          jq -e '.ok == true' /tmp/health.json >/dev/null
          curl -fsS --max-time 60 -X POST -H "x-handyman-proxy: $SECRET" "$URL/api/smoke" \
            | jq '{status, ok, model}' | tee /tmp/smoke.json
          jq -e '.ok == true and .model == "muse-spark-1.3"' /tmp/smoke.json >/dev/null

      - name: Send traffic to the new revision
        if: steps.deploy.outputs.first == 'false'
        env:
          TAG: ${{ steps.deploy.outputs.tag }}
        run: gcloud run services update-traffic "$SERVICE" --region "$REGION" --to-tags "$TAG=100"

      - name: Summary
        run: |
          URL=$(gcloud run services describe "$SERVICE" --region "$REGION" --format='value(status.url)')
          echo "Backend live at $URL (set this as BACKEND_URL in Vercel)" >> "$GITHUB_STEP_SUMMARY"
